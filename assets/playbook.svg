<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
  <title id="t">Deployment playbook</title>
  <desc id="d">Five steps in a loop: discovery on site with users, integration of client systems, APIs and data, compliance by design, production with LLM workflows and agents, human review and upkeep, which feeds back into discovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#132A4A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1200" height="250" rx="20" fill="url(#bg)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- cards: x = 40, 268, 496, 724, 952 ; width 208 -->
    <g>
      <rect x="40" y="40" width="208" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#2DD4BF" stroke-opacity="0.6"/>
      <circle cx="144" cy="40" r="16" fill="#2DD4BF"/><text x="144" y="46" font-size="16" font-weight="700" fill="#0B1220">1</text>
      <text x="144" y="94" font-size="21" font-weight="700" fill="#F8FAFC">Discovery</text>
      <text x="144" y="122" font-size="15" fill="#CBD5E1">on site, with users</text>
    </g>
    <g>
      <rect x="268" y="40" width="208" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#5EEAD4" stroke-opacity="0.6"/>
      <circle cx="372" cy="40" r="16" fill="#5EEAD4"/><text x="372" y="46" font-size="16" font-weight="700" fill="#0B1220">2</text>
      <text x="372" y="94" font-size="21" font-weight="700" fill="#F8FAFC">Integration</text>
      <text x="372" y="122" font-size="15" fill="#CBD5E1">client systems,</text>
      <text x="372" y="142" font-size="15" fill="#CBD5E1">APIs, data</text>
    </g>
    <g>
      <rect x="496" y="40" width="208" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#F472B6" stroke-opacity="0.6"/>
      <circle cx="600" cy="40" r="16" fill="#F472B6"/><text x="600" y="46" font-size="16" font-weight="700" fill="#0B1220">3</text>
      <text x="600" y="94" font-size="21" font-weight="700" fill="#F8FAFC">Compliance</text>
      <text x="600" y="122" font-size="15" fill="#CBD5E1">by design: GDPR,</text>
      <text x="600" y="142" font-size="15" fill="#CBD5E1">AI Act, sector rules</text>
    </g>
    <g>
      <rect x="724" y="40" width="208" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#818CF8" stroke-opacity="0.6"/>
      <circle cx="828" cy="40" r="16" fill="#818CF8"/><text x="828" y="46" font-size="16" font-weight="700" fill="#0B1220">4</text>
      <text x="828" y="94" font-size="21" font-weight="700" fill="#F8FAFC">Production</text>
      <text x="828" y="122" font-size="15" fill="#CBD5E1">LLM workflows</text>
      <text x="828" y="142" font-size="15" fill="#CBD5E1">and agents</text>
    </g>
    <g>
      <rect x="952" y="40" width="208" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#A5B4FC" stroke-opacity="0.6"/>
      <circle cx="1056" cy="40" r="16" fill="#A5B4FC"/><text x="1056" y="46" font-size="16" font-weight="700" fill="#0B1220">5</text>
      <text x="1056" y="94" font-size="21" font-weight="700" fill="#F8FAFC">Human review</text>
      <text x="1056" y="122" font-size="15" fill="#CBD5E1">and upkeep</text>
    </g>

    <text x="600" y="232" font-size="14" fill="#94A3B8" font-style="italic">feedback from real use goes back into discovery</text>
  </g>

  <g fill="none" stroke="#94A3B8" stroke-width="2">
    <path d="M250 100 H264" marker-end="url(#arrow)"/>
    <path d="M478 100 H492" marker-end="url(#arrow)"/>
    <path d="M706 100 H720" marker-end="url(#arrow)"/>
    <path d="M934 100 H948" marker-end="url(#arrow)"/>
    <path d="M1056 162 V196 Q1056 206 1046 206 H154 Q144 206 144 196 V166" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>
</svg>
