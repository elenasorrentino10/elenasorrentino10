<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">By the numbers</title>
  <desc id="d">Left: average patient history lookup dropped from 11 minutes, with some doctors reporting up to 15, to 5 minutes per visit, 55 percent less on average. Right: career timeline from 2021 to 2026. Work: freelance digital strategy and automation, September 2021 to December 2023; AI Specialist at MADE, January to June 2024; AdTech Specialist at Rai Pubblicità, September 2024 to April 2025; Founding AI Engineer, May 2025 to present. Education: ITS Academy diploma in AI and machine learning, 2022 to 2024; BSc at LIUC, November 2024 to October 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#132A4A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.8" stop-color="#3987E5"/>
      <stop offset="1" stop-color="#3987E5" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <!-- Panel 1: before / after, averages -->
    <text x="48" y="50" font-size="19" font-weight="700" fill="#F1F5F9">Patient history lookup</text>
    <text x="48" y="72" font-size="14" fill="#94A3B8">minutes per visit, average reported by doctors</text>

    <text x="48" y="108" font-size="14" fill="#CBD5E1">Before</text>
    <text x="348" y="108" font-size="13" fill="#94A3B8" text-anchor="end">up to 15</text>
    <rect x="48" y="116" width="220" height="30" rx="4" fill="#64748B"/>
    <g stroke="#94A3B8" stroke-width="2">
      <line x1="268" y1="131" x2="348" y2="131" stroke-dasharray="4 4"/>
      <line x1="348" y1="123" x2="348" y2="139"/>
    </g>
    <text x="258" y="137" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="end">11 min</text>

    <text x="48" y="178" font-size="14" fill="#CBD5E1">After go-live</text>
    <rect x="48" y="186" width="100" height="30" rx="4" fill="#3987E5"/>
    <text x="138" y="207" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="end">5 min</text>

    <line x1="48" y1="106" x2="48" y2="226" stroke="#94A3B8" stroke-opacity="0.5"/>

    <text x="48" y="282" font-size="40" font-weight="800" fill="#7DD3FC">−55%</text>
    <text x="172" y="268" font-size="14" fill="#BFDBFE">average time per visit,</text>
    <text x="172" y="287" font-size="14" fill="#93C5FD">lower risk of errors</text>

    <line x1="440" y1="36" x2="440" y2="294" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Panel 2: career timeline -->
    <text x="472" y="50" font-size="19" font-weight="700" fill="#F1F5F9">Career timeline</text>
    <text x="472" y="72" font-size="14" fill="#94A3B8">2021 – 2026, months per role</text>

    <!-- legend -->
    <rect x="976" y="38" width="12" height="12" rx="3" fill="#3987E5"/>
    <text x="994" y="49" font-size="13" fill="#CBD5E1">Work</text>
    <rect x="1050" y="38" width="12" height="12" rx="3" fill="#199E70"/>
    <text x="1068" y="49" font-size="13" fill="#CBD5E1">Education</text>

    <!-- year grid: x = 650 + months * 6.944 -->
    <g stroke="#FFFFFF" stroke-opacity="0.07">
      <line x1="650" y1="90" x2="650" y2="282"/>
      <line x1="733.3" y1="90" x2="733.3" y2="282"/>
      <line x1="816.7" y1="90" x2="816.7" y2="282"/>
      <line x1="900" y1="90" x2="900" y2="282"/>
      <line x1="983.3" y1="90" x2="983.3" y2="282"/>
      <line x1="1066.7" y1="90" x2="1066.7" y2="282"/>
      <line x1="1150" y1="90" x2="1150" y2="282"/>
    </g>
    <g font-size="13" fill="#94A3B8" text-anchor="middle">
      <text x="650" y="302">2021</text>
      <text x="733.3" y="302">2022</text>
      <text x="816.7" y="302">2023</text>
      <text x="900" y="302">2024</text>
      <text x="983.3" y="302">2025</text>
      <text x="1066.7" y="302">2026</text>
      <text x="1150" y="302">2027</text>
    </g>

    <!-- rows -->
    <g font-size="14" text-anchor="end">
      <text x="636" y="109" fill="#E2E8F0">Freelance automation <tspan fill="#94A3B8">· 28 mo</tspan></text>
      <text x="636" y="141" fill="#E2E8F0">ITS AI &amp; ML diploma <tspan fill="#94A3B8">· 2 yrs</tspan></text>
      <text x="636" y="173" fill="#E2E8F0">AI Specialist, MADE <tspan fill="#94A3B8">· 6 mo</tspan></text>
      <text x="636" y="205" fill="#E2E8F0">AdTech, Rai Pubblicità <tspan fill="#94A3B8">· 8 mo</tspan></text>
      <text x="636" y="237" fill="#E2E8F0">BSc, LIUC <tspan fill="#94A3B8">· 2 yrs</tspan></text>
      <text x="636" y="269" fill="#E2E8F0">Founding AI Engineer <tspan fill="#94A3B8">· ongoing</tspan></text>
    </g>
    <rect x="705.6" y="94"  width="194.4" height="20" rx="4" fill="#3987E5"/>
    <rect x="795.8" y="126" width="152.8" height="20" rx="4" fill="#199E70"/>
    <rect x="900"   y="158" width="41.7"  height="20" rx="4" fill="#3987E5"/>
    <rect x="955.5" y="190" width="55.6"  height="20" rx="4" fill="#3987E5"/>
    <rect x="969.4" y="222" width="166.7" height="20" rx="4" fill="#199E70"/>
    <rect x="1011.1" y="254" width="131.9" height="20" rx="4" fill="url(#fade)"/>
  </g>
</svg>
